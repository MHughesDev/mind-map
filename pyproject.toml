[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vault-pipeline"
version = "0.1.0"
description = "Pipeline tools for the mind-map Obsidian vault"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
llm = [
    "sentence-transformers>=3.0",
]

[project.scripts]
vault-pipeline = "vault_pipeline.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["vault_pipeline*"]

[tool.ruff]
line-length = 100
target-version = "py311"
